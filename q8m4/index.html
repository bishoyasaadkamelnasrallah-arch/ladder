<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أربع أسئلة</title>
<style>
  :root {
    --bg: #f2efe6;
    --ink: #1c2b36;
    --card: #ffffff;
    --line: #c9c3b3;
    --accent: #1c2b36;
    --accent-ink: #f2efe6;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14202a; --ink: #f2efe6; --card: #1d2d39; --line: #3a4d5b; --accent: #f2efe6; --accent-ink: #14202a; }
  }
  :root[data-theme="dark"] { --bg: #14202a; --ink: #f2efe6; --card: #1d2d39; --line: #3a4d5b; --accent: #f2efe6; --accent-ink: #14202a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Segoe UI", Tahoma, sans-serif; line-height: 1.6; }
  main { max-width: 34rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  h1 { font-size: 1.6rem; margin: 0 0 0.25rem; }
  .sub { margin: 0 0 1.5rem; opacity: 0.8; }
  .q { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 1rem; margin: 0 0 1rem; }
  .q label { display: block; font-weight: 700; margin-bottom: 0.5rem; }
  .q input { width: 100%; font: inherit; padding: 0.7rem; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  button { width: 100%; font: inherit; font-weight: 700; padding: 0.9rem; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }
  #msg { margin-top: 1rem; font-weight: 700; min-height: 1.6em; }
  #win { display: none; margin-top: 1rem; padding: 1.25rem; border-radius: 12px; border: 2px solid var(--accent); background: var(--card); font-size: 1.3rem; font-weight: 700; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>أربع أسئلة</h1>
  <p class="sub">اكتب إجابة كل سؤال. جاوب الأربعة صح، وهيظهر لك مكان الكنز.</p>
  <form id="f" autocomplete="off">
    <div class="q"><label for="a0">ما عاصمة أستراليا؟</label><input id="a0" type="text" autocapitalize="off"></div>
    <div class="q"><label for="a1">كم عدد عظام جسم الإنسان البالغ؟</label><input id="a1" type="text" autocapitalize="off"></div>
    <div class="q"><label for="a2">ما العنصر الكيميائي الذي رمزه Au؟</label><input id="a2" type="text" autocapitalize="off"></div>
    <div class="q"><label for="a3">من هو أول شهيد في المسيحية؟</label><input id="a3" type="text" autocapitalize="off"></div>
    <button id="go" type="submit">تحقق من الإجابات</button>
  </form>
  <div id="msg" role="status"></div>
  <div id="win"></div>
</main>
<script>
  var NUMWORDS = { "صفر": "0", "واحد": "1", "اتنين": "2", "اتنان": "2", "اتنتين": "2", "تلاته": "3", "اربعه": "4", "خمسه": "5", "سته": "6", "سبعه": "7", "سبع": "7", "تمانيه": "8", "تمنيه": "8", "تسعه": "9", "عشره": "10", "عشر": "10", "one": "1", "two": "2", "three": "3", "four": "4", "five": "5", "six": "6", "seven": "7", "eight": "8", "nine": "9", "ten": "10" };
  function normalize(s) {
    s = String(s).toLowerCase();
    s = s.replace(/[\u0660-\u0669]/g, function (d) { return String(d.charCodeAt(0) - 0x660); });
    s = s.replace(/[\u06F0-\u06F9]/g, function (d) { return String(d.charCodeAt(0) - 0x6F0); });
    s = s.replace(/[\u064B-\u065F\u0670\u0640]/g, "");
    s = s.replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/ؤ/g, "و").replace(/ئ/g, "ي").replace(/[طث]/g, "ت");
    s = s.replace(/[^\u0621-\u064Aa-z0-9]/g, "");
    if (s.indexOf("ال") === 0 && s.length >= 4) s = s.slice(2);
    return NUMWORDS.hasOwnProperty(s) ? NUMWORDS[s] : s;
  }

  var SALT = "IXVsUEj7rjOtfr7nqFr7EA==", IV = "UiImYQq8fnxBM38O", CTS = ["SBxPPO0D3pmJ50UMmVO/YaXhKK3Leobgi5dqR5ngHii8cYSEiBLx0PMnK+ymFWt44vX9gjuc7xDHI5M9WxYasVuI4ew=","tRVs82Dsu2Km034bjhQ08fzPc3CfqYoU+fgMfsbh86I9Rf6X+3LIrbAj6lVq8Kkw19HU6C8tRpMpYFTNk5o+tuke5dQ=","L+NQFO4WNpbbFTHa85O2jG+RrsxEHSlJz9sC2+xHq/McYpOL37MDftNCQFh62Q2F7DtB3z3qFu39J5RCZbcard43Tro=","R4OX+eF85F1Ufy+o22GfM0Su8et7WZRgY9hacFT6jipWbV6UGctH5UObHjzl4ReSmPHQGjD/kMXk9hI6OZX5tDu2YJc=","fYBPcnbIHECIdOk0xUm0eoqE1zIdWSJm4QAhruGqOAcq32NJXVnI6dmv/0gzYmVui40XL5KpogWsBIacEWBzOISAvt0=","TvlBOHgjNY6FxfexZEwbIO2JqduaYJM2cwpYFwAAp907AFDf/WrttOkZUu9dKIXyoD0GItQySLk/rNqZIiv3Mwv15nQ=","3gWBWTmREmjMtEj6GopgxS0uYIiWcyJVDdNv2+jcntP4vjW4oE7ggne7mvf+vY+exocTZUfoSi+V3ZbUdOM22iuKW/A=","mpmNe3ZoKE1K4Gdc7iAhlDBJaB9rNjEuwpNheimC45XRjNLOYMMuQr6DZAP8sheXGy6/Cuy9Sfi/rgW9fWiKPr0eKP0=","Baxipcpma6D3V9+X8NAFdFnqbefuk257bL02p0ONRW6+GUztY3oC2tAYM3G1m444TjM0xGoWr5Tj/FwnG+XBsUfjkfM=","F+TYv4yaVzHmMZg+3V+PFuMlrOn2YMEGlWZKt8jyBjWfDjMS/Oip3oSPynPfGsTmRCfd2wJfcdYnG0RcufU+ghXaclI=","u3m0BVTa2b2/tMS/xduei9M5C34Y+j1oksy3a7xfGbn2bgcwg3Oin1oGZ4LFF09HFzCo/z47P4WUjQb2z5c5hiovJiU=","Y+po4hGFRzYjVwaQljFxMtqEnhfrnyytTIZDJN1Tfo7immGjCsddlL9fPI08AbSMTJO2kja7dpwuSxBYPqe3Ul401p8=","FAehPsHXmdpuSEdxkHvfT92XUyvh4GeFfphfT+PyE86YrYaJngsZL51obR3FEqt6Z6pqR6VfQ54QoJ16onO7jY1q398=","bJ3OX/44fPA91oyxKBOWUHNcDVhLu/5K1qrKwly+tr7P0B89BmqB+SXJeg+qX9gCFsyqPsG2mWAqFdFlhTwxDyWkH8A=","CNKEiqY30IU8gPuG2yC6PR9encccBXHH/BBvR/6GPYb0pkvgvq5Jfbgt/EdEdA5oObLw0YqVf29J0yYE+e8W5KRT+MQ=","8kw9QeCPZKGQvJNCtKSYYGutX2+Ghg9XUAKNrsWexNuhArU1EedT1+jII+SSaM1xZ6G5XPHhzC+d6MOkzZIwJMMDddY=","fbzFpiuEnvHGJ5sXMJzFewesaequ8wUfqR2Xvm1DwvwflX8oyOMg3vR32evRKuNrb3YBECz9d5GWqI2eWn0vqp3YEE0=","tlnxFhaGECrpZM7ZgLgj0o/Ta2XN52JuHkgyQrVLRNrlsy5XsaQrbWMJMmqGqJBiVVDUEkA5tTFnG0+rzX3CrIuVaJQ="];
  var ITER = 150000;

  function fromB64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

  var form = document.getElementById("f"), msg = document.getElementById("msg"), win = document.getElementById("win"), btn = document.getElementById("go");

  form.addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var answers = [];
    for (var i = 0; i < 4; i++) {
      var v = normalize(document.getElementById("a" + i).value);
      if (!v) { msg.textContent = "اكتب إجابة الأسئلة الأربعة الأول."; return; }
      answers.push(v);
    }
    msg.textContent = "لحظة…";
    btn.disabled = true;
    try {
      var enc = new TextEncoder();
      var base = await crypto.subtle.importKey("raw", enc.encode(answers.join("|")), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: fromB64(SALT), iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      var text = null;
      for (var j = 0; j < CTS.length && text === null; j++) {
        try {
          var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(IV) }, key, fromB64(CTS[j]));
          text = new TextDecoder().decode(plain);
        } catch (e) {}
      }
      if (text === null) throw new Error("wrong");
      msg.textContent = "";
      win.textContent = text;
      win.style.display = "block";
      form.style.display = "none";
    } catch (e) {
      msg.textContent = "فيه إجابة غلط. جرّب تاني.";
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
