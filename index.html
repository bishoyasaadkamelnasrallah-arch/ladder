<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>روح عند باب الكانتين</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2efe6;
    --ink: #1c2b36;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14202a; --ink: #f2efe6; }
  }
  :root[data-theme="dark"] { --bg: #14202a; --ink: #f2efe6; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Reem Kufi", "Segoe UI", Tahoma, sans-serif;
  }
  h1 {
    margin: 0;
    padding: 0 1rem;
    font-weight: 600;
    font-size: clamp(2.2rem, 9vw, 5.5rem);
    text-align: center;
    transform: scaleX(-1);
  }
</style>
</head>
<body>
  <h1>روح عند باب الكانتين</h1>
</body>
  </html>
